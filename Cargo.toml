[workspace]
resolver = "2"
members = ["crates/ferrix-protocol", "crates/ferrixd"]
# The fuzz crate is intentionally excluded: cargo-fuzz keeps its own
# nightly/libfuzzer world and must not pollute the stable workspace build.
# The loadtest crate is a benchmarking tool, excluded so its throwaway-style
# code needn't satisfy the daemon's strict data-path lints.
exclude = ["fuzz", "loadtest"]

[workspace.package]
version = "1.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/josunlp/ferrixd"
homepage = "https://josunlp.github.io/ferrixd/"
documentation = "https://josunlp.github.io/ferrixd/"
authors = ["ferrixd contributors"]
keywords = ["irc", "ircd", "ircv3", "server", "chat"]
categories = ["network-programming", "command-line-utilities"]

# Lints applied uniformly to every workspace member (Cargo >= 1.74).
# These encode the project rules from the plan (§6.1):
#   * zero unsafe outside audited modules,
#   * no panics/unwrap/expect in the data path.
# The restriction lints are `warn` here and promoted to hard errors in CI
# (`-D warnings`); test modules opt out locally with `#![allow(...)]`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
dbg_macro = "warn"

[workspace.dependencies]
# --- async runtime & I/O ---
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# --- TLS (rustls + ring so the build needs no cmake/openssl) ---
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

# --- data structures & parsing helpers ---
smallvec = { version = "1", features = ["union", "const_generics"] }
memchr = "2"
dashmap = "6"
parking_lot = "0.12"

# --- auth / crypto ---
argon2 = "0.6"
subtle = "2"
base64 = "0.23"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }

# --- persistence ---
rusqlite = { version = "0.40", features = ["bundled"] }

# --- WASM plugin host (pure-Rust interpreter; no cmake/JIT, keeps the build
#     cmake-free and the dependency tree small — see crates/ferrixd/src/plugin.rs) ---
wasmi = "1"
wat = "1"

# --- config ---
serde = { version = "1", features = ["derive"] }
toml = "1"

# --- command-line interface ---
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
rpassword = "7"
getrandom = "0.4"

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- errors ---
thiserror = "2"
anyhow = "1"

# --- internal ---
ferrix-protocol = { path = "crates/ferrix-protocol", version = "1.2.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
# Release binaries ship via GitHub releases (see .github/workflows/release.yml);
# symbols only inflate the download.
strip = "symbols"

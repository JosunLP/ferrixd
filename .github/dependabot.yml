# Dependabot keeps dependencies and CI actions current.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # --- Rust workspace (ferrix-protocol + ferrixd) ---
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      # One PR per week for routine patch/minor bumps keeps the noise down;
      # major bumps still come as individual, reviewable PRs.
      cargo-minor:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  # --- GitHub Actions used by CI, docs, and release workflows ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]

  # --- Documentation site (VitePress / npm) ---
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: ["dependencies", "documentation"]
    commit-message:
      prefix: "docs"
    groups:
      docs-deps:
        applies-to: version-updates
        update-types: ["minor", "patch"]

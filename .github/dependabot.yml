# Dependabot keeps dependencies and CI actions current.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Grouping policy: bundle version bumps into as few PRs as possible so
# interdependent crates (e.g. the sha2/hmac/pbkdf2 stack, which all track the
# same `digest` version) update together and actually compile. Without this,
# each 0.x crate — where Cargo/Dependabot treat a minor bump as breaking — opens
# its own PR, and the ones that share a transitive dependency fail CI in
# isolation. `patterns: ["*"]` plus all three update-types puts every bump in one
# group per ecosystem; security updates still come as their own dedicated PRs.
version: 2
updates:
  # --- Rust workspace (ferrix-protocol + ferrixd) ---
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  # --- GitHub Actions used by CI, docs, and release workflows ---
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

  # --- Documentation site (VitePress / npm) ---
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    labels: ["dependencies", "documentation"]
    commit-message:
      prefix: "docs"
    groups:
      docs:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]

# Configuration for GitHub's automatically generated release notes.
# Categorises merged PRs by label when you click "Generate release notes".
# https://docs.github.com/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
      - wontfix
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: 💥 Breaking changes
      labels:
        - breaking-change
    - title: ✨ Features
      labels:
        - enhancement
        - feature
    - title: 📡 Protocol & conformance
      labels:
        - conformance
        - protocol
    - title: 🐛 Bug fixes
      labels:
        - bug
        - fix
    - title: 🔐 Security
      labels:
        - security
    - title: ⚡ Performance
      labels:
        - performance
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🧰 Maintenance & CI
      labels:
        - ci
        - chore
        - refactor
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: 🔃 Other changes
      labels:
        - "*"

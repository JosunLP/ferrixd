# cargo-deny configuration — supply-chain gate.
# Run with: cargo deny check

[advisories]
version = 2
# Fail on any RUSTSEC advisory affecting the dependency graph.
yanked = "deny"

[bans]
# Prefer a lean graph; flag accidental multiple-version pileups as we grow.
multiple-versions = "warn"
# Forbid `*` version requirements — except for workspace-internal path deps
# (e.g. ferrixd -> ferrix-protocol), which legitimately carry no version.
wildcards = "deny"
allow-wildcard-paths = true

[licenses]
version = 2
# Permissive licenses compatible with the project's own MIT/Apache-2.0.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # foldhash (hashbrown's default hasher, reached via rusqlite -> hashlink).
    # Zlib is a permissive, OSI-approved, FSF Free/Libre license, compatible
    # with the project's MIT/Apache-2.0 dual license.
    "Zlib",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
